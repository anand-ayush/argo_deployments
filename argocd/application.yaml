apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/anand-ayush/argo_deployments
    targetRevision: HEAD
    path: k8s   # 👈 THIS IS THE KEY
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true