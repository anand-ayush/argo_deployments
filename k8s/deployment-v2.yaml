apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-v2
spec:
  replicas: 3   # 10% traffic initially
  selector:
    matchLabels:
      app: node-app
      version: v2
  template:
    metadata:
      labels:
        app: node-app
        version: v2
    spec:
      containers:
        - name: node-app
          image: wrong-image
          ports:
            - containerPort: 3000
          env:
            - name: VERSION
              value: "v2"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000